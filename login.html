<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – Natalie's Random Shoes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #e63946; --primary: #0a0a0a; }
    body {
      font-family: Inter, sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #0a0a0a 0%, #1a1a1a 40%, #2a1010 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .auth-card {
      background: #fff; border-radius: 20px; padding: 2.5rem;
      width: 100%; max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    }
    .brand { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.5rem; }
    .btn-red {
      background: var(--accent); border: none; color: #fff; font-weight: 600;
      padding: 12px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .btn-red:hover { background: #c1121f; color: #fff; }
    .form-control { border-radius: 10px; padding: 12px 14px; }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 0.2rem rgba(230,57,70,0.15); }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    .alert-info-soft { background: #f0f7ff; border: 1px solid #cce0ff; border-radius: 10px; padding: 12px 14px; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand mb-1">Natalie's Random Shoes</div>
      <p class="text-muted small mb-0">Sign in with your verified Gmail account</p>
    </div>

    <div id="banner" class="alert-info-soft mb-3 d-none"></div>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label class="form-label fw-semibold">Gmail Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="you@gmail.com" required autocomplete="email">
        <div class="invalid-feedback">Please enter a valid Gmail address (@gmail.com).</div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="Password" required autocomplete="current-password">
        <div class="invalid-feedback">Password is required.</div>
      </div>
      <div class="form-check mb-4">
        <input type="checkbox" class="form-check-input" id="login-remember">
        <label class="form-check-label small" for="login-remember">Remember me</label>
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-red">Login</button>
        <a href="C:\Users\ZSA Intern\Downloads\natalie\stylish-1.0.0\stylish-shoes-store (3).html" class="btn btn-outline-secondary">Back to Store</a>
      </div>
    </form>

    <p class="text-center mt-4 mb-0 small text-muted">
      Don't have an account? <a href="signup.html">Create Account</a>
    </p>
  </div>

  <script>
    // Same storage keys as the store
    function getUsers() {
      return JSON.parse(localStorage.getItem('stylishUsers') || '[]');
    }
    function setCurrentUser(user) {
      if (user) localStorage.setItem('stylishUser', JSON.stringify(user));
      else localStorage.removeItem('stylishUser');
    }

    function isGmail(email) {
      return /^[^\s@]+@gmail\.com$/i.test(email) || /^[^\s@]+@googlemail\.com$/i.test(email);
    }

    // Banner messages from redirects
    (function () {
      const params = new URLSearchParams(location.search);
      const banner = document.getElementById('banner');
      if (params.get('registered') === '1') {
        banner.classList.remove('d-none');
        banner.textContent = 'Account created! Verify your Gmail first (check verify page), then login.';
      }
      if (params.get('verified') === '1') {
        banner.classList.remove('d-none');
        banner.style.background = '#e8f5e9';
        banner.style.borderColor = '#a5d6a7';
        banner.textContent = 'Gmail verified successfully. You can login now.';
      }
      if (params.get('need_verify') === '1') {
        banner.classList.remove('d-none');
        banner.style.background = '#fff3cd';
        banner.style.borderColor = '#ffe69c';
        banner.innerHTML = 'Your Gmail is not verified yet. <a href="verify-email.html">Verify now</a>';
      }
    })();

    // Same validation rules as before + Gmail-only
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const emailEl = document.getElementById('login-email');
      const passEl = document.getElementById('login-password');
      const email = emailEl.value.trim().toLowerCase();
      const password = passEl.value;

      emailEl.classList.remove('is-invalid');
      passEl.classList.remove('is-invalid');

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !isGmail(email)) {
        emailEl.classList.add('is-invalid');
        return false;
      }
      if (!password) {
        passEl.classList.add('is-invalid');
        return false;
      }

      const users = getUsers();
      const user = users.find(u => u.email === email);

      if (!user) {
        alert('No account found. Please create one.');
        location.href = 'signup.html?email=' + encodeURIComponent(email);
        return false;
      }

      if (user.password !== password) {
        passEl.classList.add('is-invalid');
        alert('Incorrect password.');
        return false;
      }

      // Must verify Gmail before dashboard / full access
      if (!user.verified) {
        localStorage.setItem('stylishPendingEmail', email);
        location.href = 'verify-email.html?need=1';
        return false;
      }

      setCurrentUser({
        name: user.name,
        email: user.email,
        mobile: user.mobile,
        verified: true
      });
      location.href = 'dashboard.html';
      return false;
    });
  </script>
</body>
</html>
