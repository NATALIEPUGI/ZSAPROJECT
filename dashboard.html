<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard – Natalie's Random Shoes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="C:\Users\ZSA Intern\Downloads\natalie\stylish-1.0.0\stylish-shoes-store (3).html">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #e63946; --primary: #0a0a0a; }
    body { font-family: Inter, sans-serif; background: #f5f5f5; min-height: 100vh; }
    .topbar {
      background: #0a0a0a; color: #fff; padding: 14px 0;
    }
    .brand { font-family: 'Playfair Display', serif; font-weight: 900; color: #fff; text-decoration: none; font-size: 1.25rem; }
    .card-dash {
      background: #fff; border: none; border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06); padding: 1.5rem;
    }
    .btn-red {
      background: var(--accent); border: none; color: #fff; font-weight: 600;
      padding: 12px 24px; border-radius: 10px;
    }
    .btn-red:hover { background: #c1121f; color: #fff; }
    .badge-verified { background: #e8f5e9; color: #2e7d32; font-weight: 600; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="brand" href="C:\Users\ZSA Intern\Downloads\natalie\stylish-1.0.0\stylish-shoes-store (3).html">Natalie's Random Shoes</a>
      <div>
        <a href="C:\Users\ZSA Intern\Downloads\natalie\stylish-1.0.0\stylish-shoes-store (3).html" class="text-white-50 text-decoration-none me-3 small">Store</a>
        <a href="#" id="logout-btn" class="text-white text-decoration-none small">Logout</a>
      </div>
    </div>
  </div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card-dash mb-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
              <h1 class="h4 mb-1">Welcome, <span id="dash-name">User</span></h1>
              <p class="text-muted small mb-0">Your account dashboard</p>
            </div>
            <span class="badge-verified" id="verify-badge">Gmail verified ✓</span>
          </div>
          <hr>
          <div class="mb-2"><span class="text-muted small">Email</span><div id="dash-email" class="fw-semibold">—</div></div>
          <div class="mb-2"><span class="text-muted small">Mobile</span><div id="dash-mobile" class="fw-semibold">—</div></div>
          <div class="mb-3"><span class="text-muted small">Status</span><div class="fw-semibold text-success">Active · Verified Gmail</div></div>
          <div class="d-grid gap-2">
            <a href="C:\Users\ZSA Intern\Downloads\natalie\stylish-1.0.0\stylish-shoes-store (3).html" class="btn btn-red">Go to Store & Shop</a>
          </div>
        </div>

        <div class="card-dash">
          <h2 class="h6 text-uppercase text-muted mb-3">Recent orders</h2>
          <div id="orders-list" class="small text-muted">No orders yet.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('stylishUser') || 'null');
    if (!user || !user.verified) {
      // Must be logged in with verified Gmail
      if (user && !user.verified) location.href = 'verify-email.html';
      else location.href = 'login.html';
    } else {
      document.getElementById('dash-name').textContent = (user.name || '').split(' ')[0] || 'User';
      document.getElementById('dash-email').textContent = user.email || '—';
      document.getElementById('dash-mobile').textContent = user.mobile || '—';
    }

    document.getElementById('logout-btn').addEventListener('click', function (e) {
      e.preventDefault();
      localStorage.removeItem('stylishUser');
      location.href = 'login.html';
    });

    try {
      const orders = JSON.parse(localStorage.getItem('stylishOrders') || '[]')
        .filter(o => o.customer && o.customer.email === (user && user.email));
      const box = document.getElementById('orders-list');
      if (orders.length) {
        box.innerHTML = orders.slice().reverse().map(o =>
          '<div class="border-bottom py-2 d-flex justify-content-between">' +
          '<span><strong>' + o.id + '</strong> · ' + (o.method || 'QR') + '</span>' +
          '<span class="fw-semibold">₱' + Number(o.total).toLocaleString('en-PH') + '</span></div>'
        ).join('');
      }
    } catch (e) {}
  </script>
</body>
</html>
